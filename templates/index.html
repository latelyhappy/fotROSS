<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>ROSS Sniper V18.9 - 終極打磨版</title>
    <style>
        body { margin: 0; background: #050811; color: #c9d1d9; font-family: sans-serif; overflow: hidden; transform-origin: top left; }
        .window { position: absolute; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.8); z-index: 1; }
        .title-bar { background: #0d1f3d !important; color: #ffffff !important; padding: 6px 10px; font-size: 11px; font-weight: bold; cursor: grab; border-bottom: 1px solid #30363d; user-select: none; }
        .content { flex: 1; padding: 4px; overflow-y: auto; font-size: 10.5px; }
        .resize-handle { width: 12px; height: 12px; background: linear-gradient(135deg, transparent 50%, #8b949e 50%); position: absolute; bottom: 0; right: 0; cursor: se-resize; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border-bottom: 1px solid #21262d; padding: 4px 2px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { color: #8b949e; background: #0d1117; position: sticky; top: 0; z-index: 2; }
        tr:hover { background-color: #161b22; cursor: pointer; }
        .sym { font-weight: bold; font-size: 12px; color: #58a6ff; cursor: pointer; text-decoration: underline; }
        .chg-pos { color: #3fb950; font-weight: bold; }
        .chg-neg { color: #f85149; font-weight: bold; }
        #zoom-controls { position: fixed; top: 10px; right: 10px; z-index: 9999; display: flex; gap: 5px; }
        #zoom-controls button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-size: 11px; }
        #sys-status { position: fixed; bottom: 10px; left: 10px; background: rgba(13,17,23,0.8); border: 1px solid #30363d; padding: 5px 10px; border-radius: 4px; font-size: 11px; z-index: 9999; }
        
        /* 戰情分析專屬樣式 */
        .detail-header { text-align: center; margin: 10px 0; }
        .detail-sym { color: #58a6ff; font-size: 20px; font-weight: bold; margin-right: 10px; }
        .detail-price { font-size: 16px; font-weight: bold; }
        .detail-stats { display: flex; justify-content: space-around; margin-bottom: 15px; font-size: 12px; background: #161b22; padding: 10px; border-radius: 4px; border: 1px solid #30363d; }
    </style>
</head>
<body>
    <div id="zoom-controls">
        <button onclick="changeZoom(0.1)">🔍 放大</button>
        <button onclick="changeZoom(-0.1)">🔍 縮小</button>
        <button id="lock-btn" onclick="toggleGlobalLock()">🔓 解鎖視窗</button>
    </div>
    
    <div class="window" id="win-gap" style="top:10px; left:10px; width:450px; height:280px;"><div class="title-bar">1. 盤前跳空漲幅榜</div><div class="content" id="gap-list"></div><div class="resize-handle"></div></div>
    
    <div class="window" id="win-news" style="top:300px; left:10px; width:450px; height:280px;"><div class="title-bar">3. 新聞催化榜 (今日熱度)</div><div class="content" id="news-list"></div><div class="resize-handle"></div></div>
    
    <div class="window" id="win-surge" style="top:10px; left:470px; width:520px; height:450px; border: 1px solid #6e40c9;"><div class="title-bar">4. 短線動能追蹤 (V18.9 Sniper Pro)</div><div class="content" id="surge-list"></div><div class="resize-handle"></div></div>
    
    <div class="window" id="win-hod" style="top:470px; left:470px; width:520px; height:300px;"><div class="title-bar">2. 突破今日新高</div><div class="content" id="hod-list"></div><div class="resize-handle"></div></div>
    
    <div class="window" id="win-detail" style="top:10px; left:1000px; width:400px; height:760px;"><div class="title-bar">📊 戰情分析與新聞</div><div class="content" id="detail-list"></div><div class="resize-handle"></div></div>

    <div id="sys-status">🔄 引擎連線中...</div>

    <script>
        let currentZoom = 1.0, isGlobalLocked = false, brainDetailsCache = {}, activeSymbol = "";

        function getActionRowStyle(row) {
            if (row.HasFreshNews) return 'style="background: linear-gradient(90deg, rgba(88,166,255,0.15) 0%, transparent 100%); border-left: 4px solid #58a6ff;"';
            if (row.Streak) {
                if (row.Streak.includes('🔴') || row.Streak.includes('🚨')) return 'style="background: rgba(248, 81, 73, 0.2); border-left: 5px solid #f85149;"';
                if (row.Streak.includes('🟡') || row.Streak.includes('⏱️')) return 'style="background: rgba(255, 165, 0, 0.15); border-left: 5px solid #ffa500;"';
                if (row.Streak.includes('🚀') || row.Streak.includes('🎯') || row.Streak.includes('🔥')) return 'style="background: rgba(255, 234, 0, 0.12); border-left: 5px solid #ffea00;"';
                if (row.Streak.includes('⚡') || row.Streak.includes('⭐')) return 'style="background: rgba(156, 39, 176, 0.2); border-left: 5px solid #d2a8ff;"';
            }
            return '';
        }

        function renderTable(id, data, cols, styleFunc=null) {
            const container = document.getElementById(id);
            if (!container) return;
            let html = `<table><thead><tr>${cols.map(c => `<th style="width:${c.w}">${c.n}</th>`).join('')}</tr></thead><tbody>`;
            data.forEach(row => {
                html += `<tr ${styleFunc ? styleFunc(row) : ''} onclick="loadDetail('${row.Code}')">`;
                cols.forEach(c => {
                    let val = row[c.k] || '';
                    if (c.k === 'Code') {
                        val = `<span class="sym" ondblclick="window.open('https://www.tradingview.com/chart/?symbol=${row.Code}')">${row.Code}</span>${row.HasCatalyst ? ' 📰' : ''}`;
                    }
                    if (c.k === 'Change' && typeof val === 'string') {
                        if (val.includes('+')) val = `<span class="chg-pos">${val}</span>`;
                        else if (val.includes('-')) val = `<span class="chg-neg">${val}</span>`;
                    }
                    if (c.k === 'FloatStr' && parseFloat(val) < 2) val = `<span style="color:#d2a8ff; font-weight:bold;">${val}</span>`;
                    if (c.k === 'Streak') {
                        if (val.includes('🎯') || val.includes('🚀') || val.includes('🔥')) val = `<span style="color:#f2cc60; font-weight:900;">${val}</span>`;
                        else if (val.includes('🚨') || val.includes('🔴')) val = `<span style="color:#f85149; font-weight:bold;">${val}</span>`;
                    }
                    html += `<td>${val}</td>`;
                });
                html += `</tr>`;
            });
            container.innerHTML = html + `</tbody></table>`;
        }

        function refresh() {
            fetch('/data?t=' + Date.now()).then(r => r.json()).then(d => {
                document.getElementById('sys-status').innerText = `🟢 V18.9 已連線 | 更新: ${d.last_update}`;
                brainDetailsCache = d.details || {};
                
                renderTable('gap-list', d.gappers, [{n:'代碼', k:'Code', w:'15%'}, {n:'價格', k:'Price', w:'20%'}, {n:'漲跌%', k:'Change', w:'20%'}, {n:'量比', k:'RVOL', w:'20%'}, {n:'浮動股', k:'FloatStr', w:'15%'}]);
                
                // 新聞排行榜增加總量與量比
                renderTable('news-list', d.news_rank || [], [{n:'代碼', k:'Code', w:'18%'}, {n:'價格', k:'Price', w:'15%'}, {n:'總量', k:'Volume', w:'18%'}, {n:'量比', k:'RVOL', w:'15%'}, {n:'浮動股', k:'FloatStr', w:'15%'}], getActionRowStyle);
                
                renderTable('surge-list', d.surge, [{n:'代碼', k:'Code', w:'14%'}, {n:'價格', k:'Price', w:'12%'}, {n:'總量', k:'Volume', w:'14%'}, {n:'量比', k:'RVOL', w:'12%'}, {n:'戰術標籤', k:'Streak', w:'35%'}, {n:'浮動', k:'FloatStr', w:'13%'}], getActionRowStyle);
                
                renderTable('hod-list', d.hod || [], [{n:'時間', k:'Time', w:'15%'}, {n:'代碼', k:'Code', w:'15%'}, {n:'價格', k:'Price', w:'15%'}, {n:'訊號', k:'Streak', w:'25%'}, {n:'浮動', k:'FloatStr', w:'15%'}], getActionRowStyle);
                
                if(activeSymbol) loadDetail(activeSymbol);
                setTimeout(refresh, 3500);
            });
        }

        function loadDetail(sym) {
            activeSymbol = sym; const d = brainDetailsCache[sym]; if(!d) return;
            
            // 🚨 加上「美東」字樣
            let news = (d.NewsList || []).map(n => `<div style="margin-bottom:12px; line-height:1.4;"><span style="color:${n.is_today?'#ffa500':'#8b949e'}; font-weight:bold; font-size:11.5px; margin-right:4px;">[${n.time} 美東]</span> <a href="${n.link}" target="_blank" style="color:#e6edf3; text-decoration:none; font-size:13.5px;">${n.title}</a></div>`).join('');
            
            // 🚨 移除 HOD，改用 價格+漲跌幅，並補上 總量
            let priceColor = (d.Change && d.Change.includes('+')) ? '#3fb950' : '#f85149';
            
            document.getElementById('detail-list').innerHTML = `
                <div class="detail-header">
                    <span class="detail-sym">${sym}</span> 
                    <span class="detail-price" style="color:${priceColor};">${d.Price || ''} (${d.Change || '0.00%'})</span>
                </div>
                <div class="detail-stats">
                    <div>總量: <b>${d.Volume || '計算中'}</b></div>
                    <div>量比: <b>${d.RVOL || '計算中'}</b></div>
                    <div>浮動股: <b>${d.FloatStr || '計算中'}</b></div>
                </div>
                <hr style="border-color:#30363d; margin-bottom: 15px;">
                ${news}
            `;
        }

        function changeZoom(v) { currentZoom += v; document.body.style.transform = `scale(${currentZoom})`; }
        function toggleGlobalLock() { isGlobalLocked = !isGlobalLocked; document.getElementById('lock-btn').innerText = isGlobalLocked ? "🔒 鎖定" : "🔓 解鎖視窗"; }
        
        let draggedW = null, resizedW = null, offsetX, offsetY, startW, startH, startX, startY;
        document.querySelectorAll('.title-bar').forEach(bar => {
            bar.onmousedown = (e) => { if(isGlobalLocked) return; draggedW = bar.parentElement; const r = draggedW.getBoundingClientRect(); offsetX = (e.clientX-r.left)/currentZoom; offsetY = (e.clientY-r.top)/currentZoom; draggedW.style.zIndex=100; };
        });
        document.querySelectorAll('.resize-handle').forEach(h => {
            h.onmousedown = (e) => { if(isGlobalLocked) return; resizedW = h.parentElement; const r = resizedW.getBoundingClientRect(); startW=r.width/currentZoom; startH=r.height/currentZoom; startX=e.clientX/currentZoom; startY=e.clientY/currentZoom; e.stopPropagation(); };
        });
        document.onmousemove = (e) => {
            if(draggedW) { draggedW.style.left = (e.clientX/currentZoom-offsetX)+'px'; draggedW.style.top = (e.clientY/currentZoom-offsetY)+'px'; }
            if(resizedW) { resizedW.style.width = (startW+(e.clientX/currentZoom-startX))+'px'; resizedW.style.height = (startH+(e.clientY/currentZoom-startY))+'px'; }
        };
        document.onmouseup = () => { if(draggedW||resizedW) saveLayout(); draggedW = resizedW = null; };
        function saveLayout() { const layout={}; document.querySelectorAll('.window').forEach(w=>{ layout[w.id]={top:w.style.top, left:w.style.left, width:w.style.width, height:w.style.height}; }); localStorage.setItem('rossLayoutV16', JSON.stringify(layout)); }
        function loadLayout() { const s=localStorage.getItem('rossLayoutV16'); if(s){ const l=JSON.parse(s); for(const id in l){ const w=document.getElementById(id); if(w){ w.style.top=l[id].top; w.style.left=l[id].left; w.style.width=l[id].width; w.style.height=l[id].height; }}} }
        window.onload = () => { loadLayout(); refresh(); };
    </script>
</body>
</html>
