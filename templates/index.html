<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>ROSS Sniper V215.9 - 終極實戰版</title>
    <style>
        body { margin: 0; background: #050811; color: #c9d1d9; font-family: sans-serif; overflow: hidden; transform-origin: top left; }
        .window { position: absolute; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; box-shadow: 0 5px 15px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden; z-index: 1; }
        .title-bar { background: #0d1f3d !important; color: #ffffff !important; padding: 5px 10px; font-size: 11px; font-weight: bold; cursor: grab; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
        .bg-blue, .bg-green, .bg-gold, .bg-red, .bg-purple, .bg-dark { background: transparent; }
        .content { flex: 1; padding: 4px; overflow-y: auto; font-size: 10.5px; }
        .resize-handle { width: 12px; height: 12px; background: linear-gradient(135deg, transparent 50%, #8b949e 50%); position: absolute; bottom: 0; right: 0; cursor: se-resize; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border-bottom: 1px solid #21262d; padding: 3px 2px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { color: #8b949e; position: sticky; top: 0; background: #0d1117; z-index: 2; font-weight: normal; }
        tr:hover { background-color: #161b22; cursor: pointer; }
        
        .sym { font-weight: bold; font-size: 12px; color: #58a6ff; cursor: pointer; text-decoration: underline; }
        .sym-alert { color: #ff7b72; font-weight: 900; font-size: 14px; text-shadow: 0 0 5px rgba(255,123,114,0.5); }
        .chg-pos { color: #3fb950; font-weight: bold; }
        .chg-neg { color: #f85149; font-weight: bold; }
        
        .sys-info { color: #8b949e; text-align: right; padding: 5px 15px; font-size: 11px; position: fixed; bottom: 0; right: 0; width: 100%; pointer-events: none; }
        
        .news-title-link { text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
        .news-title-link:hover { text-decoration: underline; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #010409; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }

        .pulse-red { animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(248, 81, 73, 0); } 100% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0); } }

        .p-box { background: #161b22; border: 1px solid #30363d; border-radius: 4px; padding: 5px; text-align: center; }
        .p-val { font-size: 14px; font-weight: bold; color: #ffffff; margin-top: 2px; }
        
        #zoom-controls { position: fixed; top: 10px; right: 10px; z-index: 9999; display: flex; align-items: center;}
        #zoom-controls button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 4px 8px; cursor: pointer; margin-left: 5px; border-radius: 4px; font-size: 11px; }
        #zoom-controls button:hover { background: #30363d; }
        #sys-status { position: fixed; bottom: 10px; left: 10px; background: rgba(13, 17, 23, 0.8); border: 1px solid #30363d; padding: 5px 10px; border-radius: 4px; font-size: 11px; z-index: 9999; color: #c9d1d9;}
        .pause-btn { background: #f85149 !important; border-color: #f85149 !important; color: white !important; animation: pulseRed 2s infinite;}
    </style>
</head>
<body>
    
    <div id="zoom-controls">
        <button onclick="changeZoom(0.1)">🔍 +</button>
        <button onclick="changeZoom(-0.1)">🔍 -</button>
        <button onclick="resetZoom()">🔄 重置</button>
        <button id="lock-btn" onclick="toggleGlobalLock()">🔓 視窗解鎖</button>
        <button id="engine-btn" onclick="toggleEngineRun()">⏹️ 停止掃描</button>
        
    </div>
    
    <div class="window" id="win-gap" style="top:10px; left:10px; width:400px; height:280px;"><div class="title-bar bg-blue">1. 盤前跳空漲幅榜</div><div class="content" id="gap-list"></div><div class="resize-handle"></div></div>
    <div class="window" id="win-vol" style="top:300px; left:10px; width:400px; height:280px;"><div class="title-bar bg-gold">3. 異常爆量上漲</div><div class="content" id="vol-list"></div><div class="resize-handle"></div></div>
    <div class="window" id="win-netvol" style="top:590px; left:10px; width:400px; height:280px;"><div class="title-bar bg-purple">7. 盤中多空量能戰 (Net Volume)</div><div class="content" id="netvol-list"></div><div class="resize-handle"></div></div>
    
    <div class="window" id="win-surge" style="top:10px; left:420px; width:500px; height:430px; box-shadow: 0 0 20px rgba(156, 39, 176, 0.2); border: 1px solid #6e40c9;"><div class="title-bar bg-green">4. 短線動能追蹤 (Sniper 狙擊核心)</div><div class="content" id="surge-list"></div><div class="resize-handle"></div></div>
    <div class="window" id="win-hod" style="top:450px; left:420px; width:500px; height:420px;"><div class="title-bar bg-green">2. 突破今日新高 <button id="pause-btn" class="pause-btn" onclick="togglePause(event)">⏸️ 暫停滾動</button></div><div class="content" id="hod-list"></div><div class="resize-handle"></div></div>
    
    <div class="window" id="win-news-score" style="top:10px; left:930px; width:440px; height:280px;"><div class="title-bar bg-purple">6. 催化劑新聞評分榜</div><div class="content" id="news-score-list"></div><div class="resize-handle"></div></div>
    <div class="window" id="win-grind" style="top:300px; left:930px; width:440px; height:280px;"><div class="title-bar bg-blue">5. 主力無量緩漲</div><div class="content" id="grind-list"></div><div class="resize-handle"></div></div>
    <div class="window" id="win-detail" style="top:590px; left:930px; width:440px; height:280px;"><div class="title-bar bg-dark">📊 戰情與新聞分析</div><div class="content" id="detail-list"><div style="padding:10px; color:#8b949e;">請點擊任何股票代碼以載入戰情報告...</div></div><div class="resize-handle"></div></div>
    
    <div id="sys-status">🔄 掃描引擎連線中...</div>

    <script>
        let currentZoom = 1.0;
        let isGlobalLocked = false;
        let isEngineRunning = true;
        let isHodPaused = false;
        
        let lastKnownHodData = [];
        let brainDetailsCache = {};
        let activeSymbol = "";

        // =====================================
        // 💡 融合區：1000筆對話框歷史紀錄 (LocalStorage) 
        // =====================================
        let sniperHistory = JSON.parse(localStorage.getItem('rossSniperHistory') || '[]');

        function updateSniperDropdown() {
            const dl = document.getElementById('sniperHistoryList');
            if (!dl) return;
            dl.innerHTML = '';
            sniperHistory.forEach(sym => {
                const opt = document.createElement('option');
                opt.value = sym;
                dl.appendChild(opt);
            });
        }
        updateSniperDropdown();

        function addTarget() {
            let tickerInput = document.getElementById('sniperInput');
            let ticker = tickerInput.value.trim().toUpperCase();
            if (!ticker) return;
            
            if (!sniperHistory.includes(ticker)) {
                sniperHistory.unshift(ticker);
                if (sniperHistory.length > 1000) sniperHistory.pop();
                localStorage.setItem('rossSniperHistory', JSON.stringify(sniperHistory));
                updateSniperDropdown();
            }

            let btn = document.getElementById('sniperBtn');
            let oldText = btn.innerText;
            btn.innerText = "⏳...";
            
            fetch('/add_target', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'ticker=' + ticker
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    btn.innerText = "✅ " + data.ticker;
                    btn.style.background = "#fff";
                    setTimeout(() => { btn.innerText = oldText; btn.style.background = "#00ff00"; }, 2000);
                    tickerInput.value = '';
                } else {
                    btn.innerText = "❌";
                    btn.style.background = "#ff3333";
                    setTimeout(() => { btn.innerText = oldText; btn.style.background = "#00ff00"; }, 2000);
                }
            }).catch(err => { console.error("鎖定失敗:", err); btn.innerText = oldText; });
        }

        document.getElementById("sniperInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") { event.preventDefault(); addTarget(); }
        });

        // =====================================
        // 視窗拖曳與控制邏輯 (完全保留)
        // =====================================
        function changeZoom(delta) {
            currentZoom += delta;
            if(currentZoom < 0.5) currentZoom = 0.5;
            if(currentZoom > 2.0) currentZoom = 2.0;
            document.body.style.transform = `scale(${currentZoom})`;
        }
        function resetZoom() {
            currentZoom = 1.0;
            document.body.style.transform = `scale(1.0)`;
        }
        function toggleGlobalLock() {
            isGlobalLocked = !isGlobalLocked;
            const btn = document.getElementById('lock-btn');
            if(isGlobalLocked) { btn.innerText = "🔒 視窗已鎖定"; btn.style.background = "#f85149"; btn.style.color="white";}
            else { btn.innerText = "🔓 視窗解鎖"; btn.style.background = "#21262d"; btn.style.color="#c9d1d9";}
        }
        function toggleEngineRun() {
            isEngineRunning = !isEngineRunning;
            const btn = document.getElementById('engine-btn');
            const statusEl = document.getElementById('sys-status');
            if(isEngineRunning) {
                btn.innerText = "⏹️ 停止掃描"; btn.style.background = "#21262d"; btn.style.color="#c9d1d9";
                statusEl.innerHTML = '🔄 掃描引擎連線中...';
                refresh();
            } else {
                btn.innerText = "▶️ 恢復掃描"; btn.style.background = "#3fb950"; btn.style.color="white";
                statusEl.innerHTML = '⏸️ 系統已暫停更新';
            }
        }
        function togglePause(e) {
            e.stopPropagation();
            isHodPaused = !isHodPaused;
            const btn = document.getElementById('pause-btn');
            if(isHodPaused) {
                btn.innerText = "▶️ 恢復滾動";
                btn.style.background = "#3fb950";
                btn.style.borderColor = "#3fb950";
                btn.style.animation = "none";
            } else {
                btn.innerText = "⏸️ 暫停滾動";
                btn.style.background = "#f85149";
                btn.style.borderColor = "#f85149";
                btn.style.animation = "pulseRed 2s infinite";
                renderHOD(lastKnownHodData); 
            }
        }

        document.querySelectorAll('.window').forEach(win => {
            const titleBar = win.querySelector('.title-bar');
            const handle = win.querySelector('.resize-handle');
            
            let isDragging = false, isResizing = false;
            let startX, startY, startLeft, startTop, startWidth, startHeight;

            titleBar.addEventListener('mousedown', (e) => {
                if (e.target.tagName.toLowerCase() === 'button') return;
                if(isGlobalLocked) return;
                isDragging = true;
                startX = e.clientX / currentZoom; startY = e.clientY / currentZoom;
                startLeft = parseInt(window.getComputedStyle(win).left, 10);
                startTop = parseInt(window.getComputedStyle(win).top, 10);
                win.style.zIndex = 100;
            });

            handle.addEventListener('mousedown', (e) => {
                if(isGlobalLocked) return;
                isResizing = true;
                startX = e.clientX / currentZoom; startY = e.clientY / currentZoom;
                startWidth = parseInt(window.getComputedStyle(win).width, 10);
                startHeight = parseInt(window.getComputedStyle(win).height, 10);
                win.style.zIndex = 100;
                e.stopPropagation();
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const dx = (e.clientX / currentZoom) - startX;
                    const dy = (e.clientY / currentZoom) - startY;
                    win.style.left = `${startLeft + dx}px`;
                    win.style.top = `${startTop + dy}px`;
                } else if (isResizing) {
                    const dx = (e.clientX / currentZoom) - startX;
                    const dy = (e.clientY / currentZoom) - startY;
                    win.style.width = `${Math.max(200, startWidth + dx)}px`;
                    win.style.height = `${Math.max(100, startHeight + dy)}px`;
                }
            });

            document.addEventListener('mouseup', () => {
                if (isDragging || isResizing) win.style.zIndex = 1;
                isDragging = false; isResizing = false;
            });
        });

        // 💡 融合區：防止雙擊事件干擾單擊
        function openTW(sym, event) {
            if(event) event.stopPropagation();
            window.open(`https://www.tradingview.com/chart/?symbol=${sym}`, '_blank');
        }

        function markRead(newsId, link) {
            fetch('/mark_read', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: newsId})
            }).then(() => {
                if(link !== '#') window.open(link, '_blank');
                refresh();
            });
        }

        function renderTable(containerId, data, cols, styleFunc=null) {
            let html = `<table><thead><tr>`;
            cols.forEach(c => html += `<th style="width:${c.w}">${c.n}</th>`);
            html += `</tr></thead><tbody>`;
            data.forEach(row => {
                let styleStr = styleFunc ? styleFunc(row) : '';
                html += `<tr ${styleStr} onclick="loadDetail('${row.Code}')">`;
                cols.forEach(c => {
                    let val = row[c.k] || '';
                    // 💡 融合區：加入雙擊開啟 TradingView 功能
                    if (c.k === 'Code') {
                        val = `<span class="sym" ondblclick="openTW('${val}', event)" title="雙擊立刻開啟 TradingView">${val}</span>`;
                    }
                    if (c.k === 'Change' && typeof val === 'string') {
                        if (val.includes('+')) val = `<span class="chg-pos">${val}</span>`;
                        else if (val.includes('-')) val = `<span class="chg-neg">${val}</span>`;
                    }
                    if (c.k === 'Streak') {
                        if (val.includes('極速') || val.includes('精準')) {
                            val = `<span style="color:#e34c26; font-weight:900;">${val}</span>`;
                        } else if (val.includes('回調')) {
                            val = `<span style="color:#58a6ff;">${val}</span>`;
                        }
                    }
                    html += `<td>${val}</td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            document.getElementById(containerId).innerHTML = html;
        }

        function renderHOD(data) {
            if(isHodPaused) return; 
            renderTable('hod-list', data, [
                {n:'時間', k:'Time', w:'15%'}, {n:'代碼', k:'Code', w:'15%'},
                {n:'價格', k:'Price', w:'15%'}, {n:'訊號', k:'Streak', w:'20%'},
                {n:'總量', k:'Volume', w:'15%'}, {n:'浮動股', k:'FloatStr', w:'15%'}
            ], (row) => row.Streak.includes('虛漲') ? 'style="background:rgba(210,153,34,0.1);"' : '');
        }

        let lastSuccessfulFetchTime = Date.now();

        function refresh() {
            if(!isEngineRunning) return;
            const ts = new Date().getTime();
            fetch('/data?t=' + ts)
                .then(r => {
                    if(!r.ok) throw new Error("HTTP error " + r.status);
                    return r.json();
                })
                .then(d => {
                    lastSuccessfulFetchTime = Date.now();
                    document.getElementById('sys-status').innerHTML = `🟢 已連線 | 更新: ${d.last_update} | 掃描次數: ${d.scan_count}`;
                    document.getElementById('sys-status').style.backgroundColor = 'rgba(13, 17, 23, 0.8)';
                    document.getElementById('sys-status').style.color = '#3fb950';

                    brainDetailsCache = d.details || {};

                    renderTable('gap-list', d.gappers, [
                        {n:'時間', k:'Time', w:'18%'}, {n:'代碼', k:'Code', w:'18%'},
                        {n:'價格', k:'Price', w:'18%'}, {n:'量比', k:'RVOL', w:'18%'},
                        {n:'漲幅', k:'Change', w:'18%'}
                    ]);
                    
                    renderTable('vol-list', d.high_vol, [
                        {n:'時間', k:'Time', w:'18%'}, {n:'代碼', k:'Code', w:'18%'},
                        {n:'總量', k:'Volume', w:'25%'}, {n:'量比', k:'RVOL', w:'20%'}
                    ]);

                    lastKnownHodData = d.hod;
                    renderHOD(d.hod);

                    renderTable('surge-list', d.surge, [
                        {n:'時間', k:'Time', w:'15%'}, {n:'代碼', k:'Code', w:'15%'},
                        {n:'價格', k:'Price', w:'15%'}, {n:'🎯訊號', k:'Streak', w:'30%'},
                        {n:'淨買量', k:'NetVolStr', w:'15%'}
                    ], (row) => {
                        if (row.Streak.includes('極速') || row.Streak.includes('精準')) return 'style="background:rgba(156, 39, 176, 0.2); border-left: 3px solid #d2a8ff;"';
                        if (row.Streak.includes('爆量')) return 'style="background:rgba(210,153,34,0.1);"';
                        return '';
                    });

                    renderTable('news-score-list', d.news_leaders, [
                        {n:'代碼', k:'Code', w:'20%'}, {n:'分數', k:'NewsScore', w:'20%'},
                        {n:'價格', k:'Price', w:'20%'}, {n:'漲幅', k:'Change', w:'20%'}
                    ]);
                    
                    renderTable('grind-list', d.grinders, [
                        {n:'時間', k:'Time', w:'18%'}, {n:'代碼', k:'Code', w:'18%'},
                        {n:'狀態', k:'Streak', w:'35%'}, {n:'價格', k:'Price', w:'18%'}
                    ]);

                    renderTable('netvol-list', d.net_vol_leaders, [
                        {n:'代碼', k:'Code', w:'15%'}, {n:'價格', k:'Price', w:'15%'},
                        {n:'淨買賣', k:'NetVolStr', w:'20%'}, {n:'主買(Buy)', k:'BuyVolStr', w:'20%'}, {n:'主賣(Sell)', k:'SellVolStr', w:'20%'}
                    ]);

                    if(activeSymbol && brainDetailsCache[activeSymbol]) {
                        loadDetail(activeSymbol);
                    }
                })
                .catch(err => {
                    console.error(err);
                });
        }

        function loadDetail(sym) {
            activeSymbol = sym;
            const d = brainDetailsCache[sym];
            if(!d) return;
            
            let newsHTML = '<div style="margin-top:10px; font-weight:bold; border-bottom:1px solid #30363d; padding-bottom:3px; margin-bottom:5px;">即時新聞與催化劑</div>';
            if (d.NewsList && d.NewsList.length > 0) {
                d.NewsList.forEach(n => {
                    if (n.title !== '檢索中...') {
                        let titleColor = n.is_read ? '#484f58' : '#e6edf3';
                        let timeStr = n.time ? `<span style="color:#8b949e; font-size:9px; margin-right:5px;">[${n.time}]</span>` : '';
                        newsHTML += `<div style="margin-bottom:6px; line-height:1.3;">${timeStr}<a href="javascript:void(0)" onclick="markRead('${n.id}', '${n.link}')" class="news-title-link" style="color:${titleColor};">${n.title}</a></div>`;
                    }
                });
            } else { newsHTML += '<div style="color:#8b949e; font-size:10px;">今日無重大公關新聞</div>'; }
            
            // 💡 融合區：右下角的巨大代碼也保留雙擊開啟 TW 的功能
            document.getElementById('detail-list').innerHTML = `<div id="hud-ticker" style="font-size: 36px; font-weight: 900; color: #58a6ff; text-align: center; margin-bottom: 8px; cursor: pointer; letter-spacing: 2px; text-shadow: 0 0 10px rgba(88, 166, 255, 0.3);" ondblclick="openTW('${sym}', event)" title="雙擊開啟 TradingView">${sym}</div><div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:4px; margin-bottom:5px;"><div class="p-box">今日最高<div class="p-val">${d.HOD}</div></div><div class="p-box">量比<div class="p-val">${d.RVOL}</div></div><div class="p-box">浮動股<div class="p-val" style="color:#58a6ff;">${d.FloatStr}</div></div></div>${newsHTML}`;
        }

        // ★ 效能優化：前端降速至每 5 秒刷新一次 (5000 毫秒)
        setInterval(refresh, 5000);

        // 每 1 秒檢查一次資料是否延遲的「心跳監測器」
        setInterval(() => {
            const statusEl = document.getElementById('sys-status');
            if (isEngineRunning && (Date.now() - lastSuccessfulFetchTime > 15000)) {
                statusEl.innerHTML = '🟥 ⚠️ 連線異常 / 數據已停滯超過 15 秒！請檢查網路或爬蟲狀態';
                statusEl.style.backgroundColor = 'rgba(244, 67, 54, 0.8)';
                statusEl.style.color = '#fff';
            }
        }, 1000);
    </script>
</body>
</html>
