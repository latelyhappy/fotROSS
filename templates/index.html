<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>ROSS Sniper V18.1 - 數據穩定版</title>
    <style>
        body { margin: 0; background: #050811; color: #c9d1d9; font-family: sans-serif; overflow-x: hidden; transform-origin: top left; }
        .window { position: absolute; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
        .title-bar { background: #0d1f3d !important; color: #ffffff !important; padding: 6px 10px; font-size: 11px; font-weight: bold; cursor: grab; border-bottom: 1px solid #30363d; }
        .content { flex: 1; padding: 4px; overflow-y: auto; font-size: 10.5px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border-bottom: 1px solid #21262d; padding: 4px 2px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { color: #8b949e; background: #0d1117; position: sticky; top: 0; }
        .sym { font-weight: bold; font-size: 12px; color: #58a6ff; cursor: pointer; text-decoration: underline; }
        #sys-status { position: fixed; bottom: 10px; left: 10px; background: rgba(13, 17, 23, 0.8); border: 1px solid #30363d; padding: 5px 10px; border-radius: 4px; font-size: 11px; z-index: 9999; }
    </style>
</head>
<body>
    <div class="window" id="win-surge" style="top:10px; left:10px; width:560px; height:600px; border: 1px solid #6e40c9;"><div class="title-bar">4. 短線動能追蹤 (V18.1 修復版)</div><div class="content" id="surge-list"></div></div>
    <div class="window" id="win-detail" style="top:10px; left:580px; width:460px; height:600px;"><div class="title-bar">📊 戰情分析與即時新聞</div><div class="content" id="detail-list"></div></div>
    <div id="sys-status">🔄 數據源修復中...</div>

    <script>
        let brainDetailsCache = {}, activeSymbol = "";

        function refresh() {
            fetch('/data?t=' + Date.now()).then(r => r.json()).then(d => {
                document.getElementById('sys-status').innerText = `🟢 V18.1 連線正常 | 更新: ${d.last_update}`;
                brainDetailsCache = d.details || {};
                const surge = d.surge || [];
                let html = '<table><thead><tr><th>代碼</th><th>價格</th><th>量比</th><th>戰術標籤</th><th>浮動</th></tr></thead><tbody>';
                surge.forEach(row => {
                    html += `<tr><td><span class="sym" onclick="loadDetail('${row.Code}')">${row.Code}</span></td><td>${row.Price}</td><td>${row.RVOL}</td><td style="color:#f2cc60; font-weight:bold;">${row.Streak}</td><td>${row.FloatStr}</td></tr>`;
                });
                document.getElementById('surge-list').innerHTML = html + '</tbody></table>';
                if(activeSymbol) loadDetail(activeSymbol);
                setTimeout(refresh, 4000);
            });
        }

        function loadDetail(sym) {
            activeSymbol = sym; const d = brainDetailsCache[sym]; if(!d) return;
            let news = (d.NewsList || []).map(n => `<div style="margin-bottom:8px;"><span style="color:${n.is_today?'#ffa500':'#8b949e'};">[${n.time}]</span> <a href="${n.link}" target="_blank" style="color:#e6edf3; text-decoration:none;">${n.title}</a></div>`).join('');
            document.getElementById('detail-list').innerHTML = `<h2 style="text-align:center;">${sym}</h2><div style="display:flex; justify-content:space-around;"><div>今日高: ${d.HOD}</div></div><hr>${news}`;
        }
        window.onload = refresh;
    </script>
</body>
</html>
