<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>ROSS Sniper V18.0 - Ultra 終極版</title>
    <style>
        body { margin: 0; background: #050811; color: #c9d1d9; font-family: sans-serif; overflow-x: hidden; transform-origin: top left; }
        .window { position: absolute; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; box-shadow: 0 5px 15px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden; }
        .title-bar { background: #0d1f3d !important; color: #ffffff !important; padding: 6px 10px; font-size: 11px; font-weight: bold; cursor: grab; border-bottom: 1px solid #30363d; user-select: none; }
        .content { flex: 1; padding: 4px; overflow-y: auto; font-size: 10.5px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border-bottom: 1px solid #21262d; padding: 4px 2px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { color: #8b949e; position: sticky; top: 0; background: #0d1117; z-index: 2; }
        .sym { font-weight: bold; font-size: 12px; color: #58a6ff; cursor: pointer; text-decoration: underline; }
        .chg-pos { color: #3fb950; font-weight: bold; }
        .chg-neg { color: #f85149; font-weight: bold; }
        #zoom-controls { position: fixed; top: 10px; right: 10px; z-index: 9999; display: flex; gap: 5px; }
        #zoom-controls button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>
    <div id="zoom-controls">
        <button onclick="changeZoom(0.1)">🔍 放大</button>
        <button onclick="changeZoom(-0.1)">🔍 縮小</button>
        <button id="lock-btn" onclick="toggleGlobalLock()">🔓 解鎖視窗</button>
    </div>
    
    <div class="window" id="win-gap" style="top:10px; left:10px; width:520px; height:280px;"><div class="title-bar">1. 盤前跳空漲幅榜</div><div class="content" id="gap-list"></div></div>
    <div class="window" id="win-surge" style="top:10px; left:540px; width:560px; height:600px; border: 1px solid #6e40c9;"><div class="title-bar">4. 短線動能追蹤 (V18 Sniper Ultra)</div><div class="content" id="surge-list"></div></div>
    <div class="window" id="win-detail" style="top:620px; left:540px; width:560px; height:280px;"><div class="title-bar">📊 戰情分析與新聞</div><div class="content" id="detail-list"></div></div>

    <script>
        let currentZoom = 1.0, isGlobalLocked = false, brainDetailsCache = {}, activeSymbol = "";

        function getActionRowStyle(row) {
            if (row.Streak) {
                if (row.Streak.includes('🔴')) return 'style="background: rgba(248, 81, 73, 0.3); border-left: 5px solid #f85149;"';
                if (row.Streak.includes('🚨')) return 'style="background: rgba(248, 81, 73, 0.15); border-left: 5px solid #f85149;"';
                if (row.Streak.includes('🟡') || row.Streak.includes('⏱️')) return 'style="background: rgba(255, 165, 0, 0.15); border-left: 5px solid #ffa500;"';
                if (row.Streak.includes('🔥') || row.Streak.includes('🎯')) return 'style="background: rgba(255, 234, 0, 0.12); border-left: 5px solid #ffea00;"';
            }
            return '';
        }

        function renderTable(id, data, cols, styleFunc=null) {
            const container = document.getElementById(id);
            if (!container) return;
            let html = `<table><thead><tr>${cols.map(c => `<th style="width:${c.w}">${c.n}</th>`).join('')}</tr></thead><tbody>`;
            data.forEach(row => {
                html += `<tr ${styleFunc ? styleFunc(row) : ''} onclick="loadDetail('${row.Code}')">`;
                cols.forEach(c => {
                    let val = row[c.k] || '';
                    if (c.k === 'Code') val = `<span class="sym" ondblclick="window.open('https://www.tradingview.com/chart/?symbol=${val}')">${val}</span>`;
                    if (c.k === 'Change' && typeof val === 'string') {
                        if (val.includes('+')) val = `<span class="chg-pos">${val}</span>`;
                        else if (val.includes('-')) val = `<span class="chg-neg">${val}</span>`;
                    }
                    if (c.k === 'Streak') {
                        if (val.includes('🎯') || val.includes('🔥')) val = `<span style="color:#f2cc60; font-weight:900;">${val}</span>`;
                        else if (val.includes('⏱️') || val.includes('🟡')) val = `<span style="color:#ffa500; font-weight:bold;">${val}</span>`;
                        else if (val.includes('🔴') || val.includes('🚨')) val = `<span style="color:#f85149; font-weight:bold;">${val}</span>`;
                    }
                    html += `<td>${val}</td>`;
                });
                html += `</tr>`;
            });
            container.innerHTML = html + `</tbody></table>`;
        }

        function refresh() {
            fetch('/data?t=' + Date.now()).then(r => r.json()).then(d => {
                brainDetailsCache = d.details || {};
                renderTable('gap-list', d.gappers, [{n:'代碼', k:'Code', w:'15%'}, {n:'價格', k:'Price', w:'18%'}, {n:'漲跌%', k:'Change', w:'18%'}, {n:'量比', k:'RVOL', w:'18%'}, {n:'浮動股', k:'FloatStr', w:'15%'}]);
                renderTable('surge-list', d.surge, [{n:'代碼', k:'Code', w:'14%'}, {n:'價格', k:'Price', w:'14%'}, {n:'量比', k:'RVOL', w:'12%'}, {n:'戰術標籤', k:'Streak', w:'45%'}, {n:'浮動', k:'FloatStr', w:'15%'}], getActionRowStyle);
                if(activeSymbol) loadDetail(activeSymbol);
                setTimeout(refresh, 3000);
            });
        }

        function loadDetail(sym) {
            activeSymbol = sym; const d = brainDetailsCache[sym]; if(!d) return;
            let news = (d.NewsList || []).map(n => `<div style="margin-bottom:8px;"><span style="color:#8b949e; font-weight:bold;">[${n.time}]</span> <a href="${n.link}" target="_blank" style="color:#e6edf3; font-size:13px; text-decoration:none;">${n.title}</a></div>`).join('');
            document.getElementById('detail-list').innerHTML = `<h2 style="text-align:center; color:#58a6ff; margin:5px 0;">${sym}</h2><div style="display:flex; justify-content:space-around; margin-bottom:10px;"><div>今日最高: <b>${d.HOD}</b></div><div>量比: <b>${d.RVOL}</b></div><div>浮動股: <b>${d.FloatStr}</b></div></div>${news}`;
        }

        function changeZoom(v) { currentZoom += v; document.body.style.transform = `scale(${currentZoom})`; }
        function toggleGlobalLock() { isGlobalLocked = !isGlobalLocked; document.getElementById('lock-btn').innerText = isGlobalLocked ? "🔒 鎖定" : "🔓 解鎖視窗"; }
        window.onload = () => { refresh(); };
    </script>
</body>
</html>
